name: RHEA 台股官方資料更新與網站發布
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'market_views.js'
      - 'overnight_views.js'
      - 'aep_views.js'
      - 'credit_views.js'
      - 'scripts/credit_collect.py'
      - 'scripts/aep_collect.py'
      - 'scripts/overnight_proxy.py'
      - 'scripts/update.py'
      - 'scripts/publish.py'
      - 'config/themes.json'
      - 'tests/**'
      - '.github/workflows/update.yml'
  schedule:
    # UTC 08:17 / 11:17 / 23:17；台北時間工作日16:17、19:17及次日07:17。
    # GitHub排程可能延遲、遺漏；不是盤中即時報價。
    - cron: '17 8,11,23 * * 1-5'
    # Sunday UTC night is Monday Taipei morning; capture delayed Friday ETF disclosures.
    - cron: '17 23 * * 0'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  actions: read
  id-token: write
concurrency:
  group: rhea-daily-collect-and-publish
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deterministic offline tests
        run: python -m unittest discover -s tests -v
      - name: Fetch public official market sources
        id: collect
        continue-on-error: true
        run: python scripts/update.py
      - name: Save verified history and audit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "public daily market snapshot and status"
            git push origin HEAD:main
          fi
      - name: Build public website bundle
        run: python scripts/publish.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify publication artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in $(seq 1 12); do
            count=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" -f name="$ARTIFACT_NAME" --jq '[.artifacts[] | select(.expired == false)] | length') || count=0
            if [ "$count" = 1 ]; then exit 0; fi
            sleep 5
          done
          echo 'Publication artifact metadata unavailable or ambiguous' >&2
          exit 1
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Flag feed failure without falsifying report
        if: steps.collect.outcome == 'failure'
        run: |
          echo "Some source feeds failed; previous verified dashboard preserved. Check data/status.json" >> "$GITHUB_STEP_SUMMARY"
          exit 1
