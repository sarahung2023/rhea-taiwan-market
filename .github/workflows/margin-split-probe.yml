name: Listed OTC margin source probe
on:
  push:
    branches: [margin-split-probe-261126]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate official OTC financing aggregate
        run: |
          python - <<'PY'
          import urllib.request,re,json,concurrent.futures
          def get(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=20) as r:return r.read().decode('utf-8-sig')
          urls=['https://www.tpex.org.tw/rsrc/asset/js/data_month.js','https://www.tpex.org.tw/rsrc/asset/js/market_overview.js','https://info.tpex.org.tw/IIH/rsrc/js/home.js','https://info.tpex.org.tw/IIH/rsrc/js/mktInfo.js','https://www.twse.com.tw/rwd/zh/marginTrading/BFIJ3U?response=json&date=20261125']
          def probe(u):
            try:
              s=get(u)
              if 'BFIJ3U' in u: print('SNAPSHOT',s[:16000]);return
              print('SCRIPT',u,'len',len(s))
              for m in list(re.finditer(r'ajax|/www/|\.json|\.php|mpv|chart-finance2|chart6|marginAmt',s,re.I))[:100]:
                print('CTX',s[max(0,m.start()-120):m.start()+180].replace('\n',' '))
            except Exception as e:print('ERROR',u,repr(e))
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as p:list(p.map(probe,urls))
          PY
