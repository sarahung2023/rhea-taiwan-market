name: Foreign flow isolated integration
on:
  push:
    branches: [foreign-flow-integration-261126]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: node --check foreign_views.js
      - name: Live read-only verification and public export
        run: |
          python - <<'PY'
          import sys,tempfile,shutil
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from foreign_collect import run
          with tempfile.TemporaryDirectory() as d:
              p=Path(d);shutil.copytree('data/daily',p/'daily')
              x=run(p)
              assert x['state']=='ok',x['errors']
              r=next(r for r in x['rows'] if r['date']=='2026-11-25')
              assert r['tse_net_yuan']==-123654798153 and r['otc_net_yuan']==-6572000000 and r['otc_detail_net_yuan']==-6932657000,r
              shutil.copy2(p/'foreign.json','data/foreign.json')
          PY
          python scripts/publish.py
          test -f _site/data/foreign.json
          test -f _site/foreign_views.js
