name: Margin split isolated integration
on:
  push:
    branches: [margin-split-integration-261126]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: node --check margin_split_views.js
      - name: Live official data integration without production writes
        run: |
          python - <<'PY'
          import sys,json,tempfile,shutil
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from margin_split_collect import run
          with tempfile.TemporaryDirectory() as d:
              p=Path(d)
              shutil.copytree('data/daily',p/'daily')
              x=run(p)
              for r in x['rows']:
                  print(r['date'],[(k,m['balance_yuan'],m['maintenance_pct'],len(m.get('reference_prices',[])),len(m.get('missing_prices',[]))) for k,m in r['markets'].items()])
              latest=x['rows'][-1]
              assert latest['date']==x['market_date']
              assert all(latest['markets'][k]['maintenance_pct'] is not None for k in ('TSE','OTC')), x['errors']
              print('LIVE VERIFIED',latest['date'])
              shutil.copy2(p/'margin_split.json','data/margin_split.json')
          PY
      - run: python scripts/publish.py && test -f _site/data/margin_split.json && test -f _site/margin_split_views.js
