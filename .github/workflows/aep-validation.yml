name: AEP isolated end-to-end validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/aep_collect.py'
      - 'aep_views.js'
      - 'index.html'
      - '.github/workflows/aep-validation.yml'
      - 'data/aep_official_history/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline regression and frontend syntax
        run: |
          python -m unittest discover -s tests -v
          node --check aep_views.js
      - name: Full data collection and publication bundle in isolated checkout
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import aep_collect as a
          from pathlib import Path
          import json
          p=Path('data')
          a.run(p)
          x=json.loads((p/'aep.json').read_text())
          assert x['state']=='ok',x.get('last_error')
          o=x['official_flow']
          d=x['descriptive']
          assert o['date']==d['date']==x['market_date']
          assert o['n']<=o['expected'] and d['n']<=d['expected']
          assert o['n']>0, 'no actual official data for market date'
          assert d['n']>0, 'no actual holdings data'
          assert len(d['funds'])==d['n']
          assert len(d['top_reduced'])<=5
          assert len(o['details'])==o['n']
          assert o['state']=='complete' or o['flow_100m'] is None
          print('VALIDATION_SUMMARY',json.dumps({'market_date':x['market_date'],'official_n':o['n'],'official_net_partial':o['partial_flow_100m'],'holdings_n':d['n'],'missing':d['missing'],'issuer_errors':d['issuer_errors'],'ranked_reductions':d['top_reduced'],'cash_available':d['cash_available']},ensure_ascii=False))
          PY
          python scripts/publish.py
          test -s _site/data/aep.json
          grep -q aepHoldingsExtra _site/index.html
