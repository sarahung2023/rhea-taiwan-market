name: Listed OTC margin source probe
on:
  push:
    branches: [margin-split-probe-261126]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official OTC amount data
        run: |
          python - <<'PY'
          import urllib.request,json,re,concurrent.futures
          def get(u):
            req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'})
            with urllib.request.urlopen(req,timeout=20) as r:return r.read().decode('utf-8-sig')
          urls=['https://www.twse.com.tw/dashboard/js/credit-margin.js','https://www.tpex.org.tw/zh-tw/mainboard/trading/statistics/month.html','https://www.tpex.org.tw/zh-tw/market-infomation.html','https://info.tpex.org.tw/IIH/zh/','https://www.tpex.org.tw/openapi/swagger.json','https://www.tpex.org.tw/web/stock/margin_trading/margin_balance/margin_bal_result.php?l=zh-tw&o=json&d=115/11/25']
          def probe(u):
            try:
              s=get(u)
              if 'credit-margin.js' in u:
                for m in re.finditer('tpex|marginAmt',s,re.I):
                  z=s[max(0,m.start()-100):m.start()+180]
                  if 'URL' in z or 'api' in z or 'http' in z or 'marginAmt' in z:print('DASH',z)
              elif 'swagger.json' in u:
                j=json.loads(s)
                for p,v in j.get('paths',{}).items():
                  t=json.dumps(v,ensure_ascii=False)
                  if any(k in t for k in ['融資金額','融資餘額','市場交易概況']):print('SWAGGER',p,t[:800])
              elif 'margin_bal_result' in u:
                j=json.loads(s);print('OLD',list(j));print('OLD_META',json.dumps({k:v for k,v in j.items() if k!='aaData' and k!='data'},ensure_ascii=False)[:8000])
              else:
                print('PAGE',u)
                for m in re.finditer('融資金額|/www/|/api/|<script[^>]+src=',s):print('CTX',s[max(0,m.start()-80):m.start()+180])
            except Exception as e:print('ERROR',u,repr(e))
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as p:list(p.map(probe,urls))
          PY
